[project]
name = "lidar2grid"
version = "0.1.0"
description = "Reconstruct an electricity network (poles, spans, conductors) from airborne LiDAR"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "laspy[lazrs]>=2.5",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
